<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Can Goods Inventory</title>

<!-- ZXing Barcode Scanner -->
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f1;
    color: #222;
}

/* HEADER */

.header {
    background: #176b3a;
    color: white;
    padding: 20px 15px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 25px;
}

.header p {
    margin: 6px 0 0;
    font-size: 14px;
}

/* CONTAINER */

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

/* DASHBOARD */

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h2 {
    margin: 0;
    color: #176b3a;
    font-size: 28px;
}

.card p {
    margin: 5px 0 0;
    color: #666;
}

/* SECTION */

.section {
    background: white;
    margin-top: 15px;
    padding: 18px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section h3 {
    margin-top: 0;
}

/* INPUT */

input,
select {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

/* BUTTON */

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #176b3a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    opacity: 0.8;
}

.yellow-button {
    background: #e6a900;
}

.red-button {
    background: #c62828;
}

.blue-button {
    background: #1976d2;
}

.gray-button {
    background: #666;
}

/* CAMERA */

#camera {
    width: 100%;
    max-height: 350px;
    border-radius: 12px;
    background: black;
    display: none;
    margin-top: 10px;
}

.scan-box {
    position: relative;
}

.scan-line {
    position: absolute;
    left: 10%;
    right: 10%;
    top: 50%;
    height: 3px;
    background: red;
    display: none;
}

/* RESULT */

#result {
    margin-top: 15px;
    padding: 15px;
    border-radius: 10px;
    background: #eef7ef;
    display: none;
}

.success {
    color: #176b3a;
    font-weight: bold;
}

.error {
    color: #c62828;
    font-weight: bold;
}

.warning {
    color: #e08a00;
    font-weight: bold;
}

/* PRODUCT LIST */

.product {
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
}

.product-image {
    width: 100%;
    max-height: 180px;
    object-fit: contain;
    border-radius: 8px;
    background: #eee;
    margin-bottom: 10px;
}

.product-name {
    font-size: 18px;
    font-weight: bold;
    color: #176b3a;
}

.product-info {
    margin-top: 5px;
    font-size: 14px;
    line-height: 1.6;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    margin-top: 5px;
}

.status-in {
    background: #d8f3dc;
    color: #176b3a;
}

.status-low {
    background: #fff0c2;
    color: #9a6900;
}

.status-out {
    background: #ffd9d9;
    color: #c62828;
}

.product-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 10px;
}

.product-buttons button {
    margin-top: 0;
    font-size: 13px;
    padding: 10px;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 1000;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 15px;
    padding: 20px;
}

.modal-box h2 {
    margin-top: 0;
    color: #176b3a;
}

.close-button {
    background: #777;
}

/* EMPTY */

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

/* LOADING */

.loading {
    text-align: center;
    padding: 15px;
    color: #666;
}

/* RESPONSIVE */

@media (min-width: 600px) {

    .cards {
        grid-template-columns: repeat(4, 1fr);
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>🥫 Can Goods Inventory</h1>

    <p>Inventory Management System</p>

</div>


<div class="container">


<!-- DASHBOARD -->

<div class="cards">

    <div class="card">

        <h2 id="productsCount">0</h2>

        <p>Products</p>

    </div>


    <div class="card">

        <h2 id="stockCount">0</h2>

        <p>Total Stock</p>

    </div>


    <div class="card">

        <h2 id="lowStockCount">0</h2>

        <p>Low Stock</p>

    </div>


    <div class="card">

        <h2 id="outStockCount">0</h2>

        <p>Out of Stock</p>

    </div>

</div>


<!-- SEARCH / SCANNER -->

<div class="section">

    <h3>📷 Barcode Scanner</h3>


    <div class="scan-box">

        <video
            id="camera"
            playsinline>
        </video>

        <div
            id="scanLine"
            class="scan-line">
        </div>

    </div>


    <button
        class="yellow-button"
        onclick="startScanner()">

        📷 START SCANNER

    </button>


    <button
        id="stopButton"
        class="red-button"
        onclick="stopScanner()"
        style="display:none;">

        ⛔ STOP CAMERA

    </button>


    <label>Barcode</label>

    <input
        type="text"
        id="barcode"
        placeholder="Scan or enter barcode">


    <button
        onclick="searchBarcode()">

        🔍 SEARCH BARCODE

    </button>


    <div id="result"></div>

</div>


<!-- ADD PRODUCT -->

<div class="section">

    <h3>➕ Product Management</h3>

    <button
        onclick="openAddModal()">

        ➕ ADD NEW PRODUCT

</div>


<!-- PRODUCT SEARCH -->

<div class="section">

    <h3>📦 Products</h3>

    <input
        type="text"
        id="productSearch"
        placeholder="🔎 Search product or barcode"
        oninput="filterProducts()">

    <div id="productList">

        <div class="loading">
            Loading products...
        </div>

</div>


</div>


<!-- ADD / EDIT MODAL -->

<div
    id="productModal"
    class="modal">

    <div class="modal-box">

        <h2 id="modalTitle">
            ➕ Add Product
        </h2>


        <input
            type="hidden"
            id="editProductId">


        <label>Barcode *</label>

        <input
            type="text"
            id="formBarcode"
            placeholder="Barcode number">


        <label>Product Name *</label>

        <input
            type="text"
            id="formProductName"
            placeholder="Example: Mega Sardines">


        <label>Brand</label>

        <input
            type="text"
            id="formBrand"
            placeholder="Example: Mega">


        <label>Category</label>

        <input
            type="text"
            id="formCategory"
            placeholder="Example: Sardines">


        <label>Unit</label>

        <input
            type="text"
            id="formUnit"
            placeholder="Example: can">


        <label>Stock</label>

        <input
            type="number"
            id="formStock"
            min="0"

        <label>Minimum Stock</label>

        <input
            type="number"
            id="formMinimumStock"
            min="0"
            value="5">

        <input
            type="number"
            id="formPrice"
            min="0"

        <label>Product Image URL</label>

            id="formImage"

        <button

            💾 SAVE PRODUCT

        </button>


        <button

            ✖ CLOSE

        </button>

    </div>

</div>


<!-- STOCK MODAL -->

<div
    id="stockModal"
    class="modal">

    <div class="modal-box">

        <h2 id="stockModalTitle">
            📦 Stock
        </h2>

        <input
            type="hidden"
            id="stockProductId">

        <label>Quantity</label>

        <input
            type="number"
            id="stockQuantity"
            min="1"
            value="1">

        <button
            id="stockConfirmButton"

        </button>

        <button

            ✖ CANCEL

        </button>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
    'https://xemdlccejsdoglczepsm.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_uXDEsaRgAPdwnLrcTjAj4A_j88ihGi4';

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let codeReader = null;

let productsData = [];

let stockAction = "";


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProducts();

    }
);


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    const list =
        document.getElementById("productList");

    list.innerHTML =
        '<div class="loading">Loading products...</div>';

    try {

        const { data, error } =
            await supabaseClient
                .from("products")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


        if (error) {

            console.error(error);

            list.innerHTML =
                '<div class="error">❌ Cannot load products.<br>' +
                error.message +
                '</div>';

            return;

        }


        productsData = data || [];


        updateDashboard();

        displayProducts(productsData);

    }

    catch (error) {

        console.error(error);

        list.innerHTML =
            '<div class="error">' +
            '❌ Database connection error.' +
            '</div>';

    }

}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard() {

    let totalStock = 0;

    let lowStock = 0;

    let outStock = 0;


    productsData.forEach(function(product) {

        const stock =
            Number(product.stock || 0);

        const minimum =
            Number(product.minimum_stock || 0);


        totalStock += stock;


        if (stock === 0) {

            outStock++;

        }

        else if (stock <= minimum) {

            lowStock++;

        }

    });


    document.getElementById(
        "productsCount"
    ).textContent =
        productsData.length;


    document.getElementById(
        "stockCount"
    ).textContent =
        totalStock;


    document.getElementById(
        "lowStockCount"
    ).textContent =
        lowStock;


    document.getElementById(
        "outStockCount"
    ).textContent =
        outStock;

}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(products) {

    const list =
        document.getElementById("productList");


    if (!products || products.length === 0) {

        list.innerHTML =
            '<div class="empty">' +
            '📦 No products found.' +
            '</div>';

        return;

    }


    list.innerHTML = "";


    products.forEach(function(product) {

        const stock =
            Number(product.stock || 0);

        const minimum =
            Number(product.minimum_stock || 0);


        let statusText = "";

        let statusClass = "";


        if (stock === 0) {

            statusText =
                "🔴 OUT OF STOCK";

            statusClass =
                "status-out";

        }

        else if (stock <= minimum) {

            statusText =
                "🟡 LOW STOCK";

            statusClass =
                "status-low";

        }

        else {

            statusText =
                "🟢 IN STOCK";

            statusClass =
                "status-in";

        }


        const div =
            document.createElement("div");


        div.className = "product";


        let imageHTML = "";


        if (product.image) {

            imageHTML =
                '<img class="product-image" ' +
                'src="' +
                escapeHTML(product.image) +
                '" ' +
                'onerror="this.style.display=\'none\'">' ;

        }


        div.innerHTML =

            imageHTML +

            '<div class="product-name">' +
            escapeHTML(
                product.product_name || "Unnamed Product"
            ) +
            '</div>' +

            '<div class="product-info">' +

            '<strong>Barcode:</strong> ' +
            escapeHTML(product.barcode || "-") +

            '<br>' +

            '<strong>Brand:</strong> ' +
            escapeHTML(product.brand || "-") +

            '<br>' +

            '<strong>Category:</strong> ' +
            escapeHTML(product.category || "-") +

            '<br>' +

            '<strong>Unit:</strong> ' +
            escapeHTML(product.unit || "-") +

            '<br>' +

            '<strong>Stock:</strong> ' +
            stock +

            '<br>' +

            '<strong>Minimum:</strong> ' +
            minimum +

            '<br>' +

            '<strong>Price:</strong> ₱' +
            Number(product.price || 0)
                .toFixed(2) +

            '<br>' +

            '<span class="status ' +
            statusClass +
            '">' +
            statusText +
            '</span>' +

            '</div>' +

            '<div class="product-buttons">' +

            '<button ' +
            'class="blue-button" ' +
            'onclick="openStockModal(' +
            product.id +
            ', \'in\')">' +
            '📥 STOCK IN' +
            '</button>' +

            '<button ' +
            'class="red-button" ' +
            'onclick="openStockModal(' +
            product.id +
            ', \'out\')">' +
            '📤 STOCK OUT' +
            '</button>' +

            '<button ' +
            'onclick="editProduct(' +
            product.id +
            ')">' +
            '✏️ EDIT' +
            '</button>' +

            '<button ' +
            'class="gray-button" ' +
            'onclick="deleteProduct(' +
            product.id +
            ')">' +
            '🗑️ DELETE' +
            '</button>' +

            '</div>';


        list.appendChild(div);

    });

}


/* =====================================================
   FILTER PRODUCTS
===================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "productSearch"
        ).value
        .toLowerCase()
        .trim();


    if (search === "") {

        displayProducts(productsData);

        return;

    }


    const filtered =
        productsData.filter(function(product) {

            return (

                String(
                    product.barcode || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    product.product_name || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    product.brand || ""
                )
                .toLowerCase()
                .includes(search)

            );

        });


    displayProducts(filtered);

}


/* =====================================================
   BARCODE SCANNER
===================================================== */

async function startScanner() {

    const video =
        document.getElementById("camera");

    const scanLine =
        document.getElementById("scanLine");

    const stopButton =
        document.getElementById("stopButton");

    const result =
        document.getElementById("result");


    result.style.display = "block";

    result.innerHTML =
        "📷 Starting camera...";


    try {

        codeReader =
            new ZXing.BrowserMultiFormatReader();


        video.style.display = "block";

        scanLine.style.display = "block";

        stopButton.style.display = "block";


        const devices =
            await codeReader.listVideoInputDevices();


        if (devices.length === 0) {

            throw new Error(
                "No camera found."
            );

        }


        let selectedDeviceId =
            devices[
                devices.length - 1
            ].deviceId;


        for (
            const device of devices
        ) {

            const label =
                (
                    device.label || ""
                ).toLowerCase();


            if (
                label.includes("back") ||
                label.includes("rear") ||
                label.includes("environment")
            ) {

                selectedDeviceId =
                    device.deviceId;

                break;

            }

        }


        codeReader.decodeFromVideoDevice(

            selectedDeviceId,

            video,

            function(result, error) {

                if (result) {

                    const barcode =
                        result.getText();


                    document.getElementById(
                        "barcode"
                    ).value =
                        barcode;


                    stopScanner();


                    searchBarcode();

                }

            }

        );

    }

    catch (error) {

        console.error(error);


        result.style.display = "block";

        result.innerHTML =

            '<span class="error">' +

            '❌ Camera could not start.' +

            '</span><br><br>' +

            'Please allow camera permission ' +
            'and try again.';

    }

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner() {

    if (codeReader) {

        try {

            codeReader.reset();

        }

        catch (error) {

            console.log(error);

        }


        codeReader = null;

    }


    const video =
        document.getElementById("camera");

    const scanLine =
        document.getElementById("scanLine");

    const stopButton =
        document.getElementById("stopButton");


    video.style.display = "none";

    scanLine.style.display = "none";

    stopButton.style.display = "none";

}


/* =====================================================
   SEARCH BARCODE
===================================================== */

async function searchBarcode() {

    const barcode =
        document.getElementById(
            "barcode"
        ).value.trim();


    const result =
        document.getElementById(
            "result"
        );


    if (barcode === "") {

        result.style.display = "block";

        result.innerHTML =

            '<span class="error">' +

            '⚠️ Please enter a barcode.' +

            '</span>';

        return;

    }


    result.style.display = "block";

    result.innerHTML =
        "🔎 Searching inventory...";


    try {

        const { data, error } =
            await supabaseClient
                .from("products")
                .select("*")
                .eq("barcode", barcode)
                .maybeSingle();


        if (error) {

            console.error(error);

            result.innerHTML =

                '<span class="error">' +

                '❌ Search error<br><br>' +

                escapeHTML(
                    error.message
                ) +

                '</span>';

            return;

        }


        if (!data) {

            result.innerHTML =

                '<span class="warning">' +

                '⚠️ Product not found.' +

                '</span><br><br>' +

                '<strong>Barcode:</strong> ' +
                escapeHTML(barcode) +

                '<br><br>' +

                'You can add this product ' +
                'using the ADD NEW PRODUCT button.';

            return;

        }


        showSearchResult(data);

    }

    catch (error) {

        console.error(error);

        result.innerHTML =

            '<span class="error">' +
            '❌ Database error.' +
            '</span>';

    }

}


/* =====================================================
   SEARCH RESULT
===================================================== */

function showSearchResult(product) {

    const result =
        document.getElementById("result");


    const stock =
        Number(product.stock || 0);

    const minimum =
        Number(product.minimum_stock || 0);


    let statusText = "";

    let statusClass = "";


    if (stock === 0) {

        statusText =
            "🔴 OUT OF STOCK";

        statusClass =
            "status-out";

    }

    else if (stock <= minimum) {

        statusText =
            "🟡 LOW STOCK";

        statusClass =
            "status-low";

    }

    else {

        statusText =
            "🟢 IN STOCK";

        statusClass =
            "status-in";

    }


    let imageHTML = "";


    if (product.image) {

        imageHTML =

            '<br>' +

            '<img class="product-image" ' +

            'src="' +
            escapeHTML(product.image) +
            '" ' +

            'onerror="this.style.display=\'none\'">';

    }


    result.innerHTML =

        '<strong>Barcode:</strong> ' +
        escapeHTML(product.barcode) +

        '<br><br>' +

        imageHTML +

        '<div style="font-size:20px;font-weight:bold;color:#176b3a;">' +

        escapeHTML(
            product.product_name
        ) +

        '</div>' +

        '<br>' +

        '<strong>Brand:</strong> ' +
        escapeHTML(product.brand || "-") +

        '<br>' +

        '<strong>Category:</strong> ' +
        escapeHTML(product.category || "-") +

        '<br>' +

        '<strong>Stock:</strong> ' +
        stock +

        '<br>' +

        '<strong>Price:</strong> ₱' +
        Number(product.price || 0)
            .toFixed(2) +

        '<br><br>' +

        '<span class="status ' +
        statusClass +
        '">' +
        statusText +
        '</span>' +

        '<br><br>' +

        '<button onclick="openStockModal(' +
        product.id +
        ', \'in\')">' +
        '📥 STOCK IN' +
        '</button>' +

        '<button class="red-button" ' +
        'onclick="openStockModal(' +
        product.id +
        ', \'out\')">' +
        '📤 STOCK OUT' +
        '</button>' +

        '<button class="blue-button" ' +
        'onclick="editProduct(' +
        product.id +
        ')">' +
        '✏️ EDIT PRODUCT' +
        '</button>';

}


/* =====================================================
   OPEN ADD PRODUCT
===================================================== */

function openAddModal() {

    document.getElementById(
        "modalTitle"
    ).textContent =
        "➕ Add Product";


    document.getElementById(
        "editProductId"
    ).value = "";


    document.getElementById(
        "formBarcode"
    ).value = "";


    document.getElementById(
        "formProductName"
    ).value = "";


    document.getElementById(
        "formBrand"
    ).value = "";


    document.getElementById(
        "formCategory"
    ).value = "";


    document.getElementById(
        "formUnit"
    ).value = "";


    document.getElementById(
        "formStock"
    ).value = "0";


    document.getElementById(
        "formMinimumStock"
    ).value = "5";


    document.getElementById(
        "formPrice"
    ).value = "0";


    document.getElementById(
        "formImage"
    ).value = "";


    document.getElementById(
        "productModal"
    ).style.display =
        "flex";

}


/* =====================================================
   CLOSE PRODUCT MODAL
===================================================== */

function closeModal() {

    document.getElementById(
        "productModal"
    ).style.display =
        "none";

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct() {

    const id =
        document.getElementById(
            "editProductId"
        ).value;


    const barcode =
        document.getElementById(
            "formBarcode"
        ).value.trim();


    const product_name =
        document.getElementById(
            "formProductName"
        ).value.trim();


    const brand =
        document.getElementById(
            "formBrand"
        ).value.trim();


    const category =
        document.getElementById(
            "formCategory"
        ).value.trim();


    const unit =
        document.getElementById(
            "formUnit"
        ).value.trim();


    const stock =
        Number(
            document.getElementById(
                "formStock"
            ).value || 0
        );


    const minimum_stock =
        Number(
            document.getElementById(
                "formMinimumStock"
            ).value || 0
        );


    const price =
        Number(
            document.getElementById(
                "formPrice"
            ).value || 0
        );


    const image =
        document.getElementById(
            "formImage"
        ).value.trim();


    if (
        barcode === "" ||
        product_name === ""
    ) {

        alert(
            "Please enter Barcode and Product Name."
        );

        return;

    }


    if (stock < 0) {

        alert(
            "Stock cannot be negative."
        );

        return;

    }


    const product = {

        barcode:
            barcode,

        product_name:
            product_name,

        brand:
            brand,

        category:
            category,

        unit:
            unit,

        stock:
            stock,

        minimum_stock:
            minimum_stock,

        price:
            price,

        image:
            image

    };


    try {

        let response;


        if (id) {

            response =
                await supabaseClient
                    .from("products")
                    .update(product)
                    .eq("id", id);

        }

        else {

            response =
                await supabaseClient
                    .from("products")
                    .insert([product]);

        }


        if (response.error) {

            console.error(
                response.error
            );


            alert(
                "❌ Error saving product:\n\n" +
                response.error.message
            );

            return;

        }


        alert(
            id
            ? "✅ Product updated successfully!"
            : "✅ Product added successfully!"
        );


        closeModal();

        await loadProducts();

    }

    catch (error) {

        console.error(error);

        alert(
            "❌ Database error."
        );

    }

}

/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id) {

    const product =
        productsData.find(
            function(item) {

                return item.id == id;

            }
        );


    if (!product) {

        return;

    }


    const confirmDelete =
        confirm(
            "Delete this product?\n\n" +
            product.product_name
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const { error } =
            await supabaseClient
                .from("products")
                .delete()
                .eq("id", id);


        if (error) {

            alert(
                "❌ Delete failed:\n\n" +
                error.message
            );

            return;

        }


        alert(
            "✅ Product deleted."
        );


        await loadProducts();

    }

    catch (error) {

        console.error(error);

        alert(
            "❌ Database error."
        );

    }

}


/* =====================================================
   STOCK MODAL
===================================================== */

function openStockModal(
    id,
    action
) {

    const product =
        productsData.find(
            function(item) {

                return item.id == id;

            }
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    stockAction =
        action;


    document.getElementById(
        "stockProductId"
    ).value =
        id;


    document.getElementById(
        "stockQuantity"
    ).value =
        1;


    if (action === "in") {

        document.getElementById(
            "stockModalTitle"
        ).textContent =
            "📥 Stock In - " +
            product.product_name;

        document.getElementById(
            "stockConfirmButton"
        ).className =
            "blue-button";

        document.getElementById(
            "stockConfirmButton"
        ).textContent =
            "📥 CONFIRM STOCK IN";

    }

    else {

        document.getElementById(
            "stockModalTitle"
        ).textContent =
            "📤 Stock Out - " +
            product.product_name;

        document.getElementById(
            "stockConfirmButton"
        ).className =
            "red-button";

        document.getElementById(
            "stockConfirmButton"
        ).textContent =
            "📤 CONFIRM STOCK OUT";

    }


    document.getElementById(
        "stockModal"
    ).style.display =
        "flex";

}


/* =====================================================
   CLOSE STOCK MODAL
===================================================== */

function closeStockModal() {

    document.getElementById(
        "stockModal"
    ).style.display =
        "none";

}


/* =====================================================
   CONFIRM STOCK
===================================================== */

async function confirmStock() {

    const id =
        document.getElementById(
            "stockProductId"
        ).value;


    const quantity =
        Number(
            document.getElementById(
                "stockQuantity"
            ).value || 0
        );


    if (
        quantity <= 0
    ) {

        alert(
            "Please enter a valid quantity."
        );

        return;

    }


    const product =
        productsData.find(
            function(item) {

                return item.id == id;

            }
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    const currentStock =
        Number(
            product.stock || 0
        );


    let newStock;


    if (stockAction === "in") {

        newStock =
            currentStock +
            quantity;

    }

    else {

        if (
            quantity >
            currentStock
        ) {

            alert(
                "❌ Stock Out cannot be greater than current stock.\n\n" +
                "Current stock: " +
                currentStock
            );

            return;

        }


        newStock =
            currentStock -
            quantity;

    }


    try {

        const { error } =
            await supabaseClient
                .from("products")
                .update({
                    stock: newStock
                })
                .eq("id", id);


        if (error) {

            alert(
                "❌ Stock update failed:\n\n" +
                error.message
            );

            return;

        }


        alert(

            stockAction === "in"

            ? "✅ Stock In successful!\n\nNew stock: " +
              newStock

            : "✅ Stock Out successful!\n\nNew stock: " +
              newStock

        );


        closeStockModal();

        await loadProducts();


        /* Refresh search result if barcode exists */

        const barcode =
            document.getElementById(
                "barcode"
            ).value.trim();


        if (barcode !== "") {

            searchBarcode();

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "❌ Database error."
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
