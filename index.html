<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f1;
    color: #222;
}

.header {
    background: #176b3a;
    color: white;
    padding: 20px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 5px 0 0;
    font-size: 14px;
}

.container {
    padding: 15px;
    max-width: 600px;
    margin: auto;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h2 {
    margin: 0;
    color: #176b3a;
    font-size: 28px;
}

.card p {
    margin: 5px 0 0;
    color: #666;
}

.scanner {
    background: white;
    margin-top: 15px;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.scanner h3 {
    margin-top: 0;
}

#camera {
    width: 100%;
    border-radius: 12px;
    background: #000;
    display: none;
}

.scan-box {
    position: relative;
    margin-top: 10px;
}

.scan-line {
    position: absolute;
    left: 10%;
    right: 10%;
    top: 50%;
    height: 3px;
    background: red;
    display: none;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #176b3a;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.scan-button {
    background: #e6a900;
}

.stop-button {
    background: #c62828;
    display: none;
}

#result {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #eef7ef;
    display: none;
}

.success {
    color: #176b3a;
    font-weight: bold;
}

.error {
    color: #c62828;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="header">

    <h1>🥫 Can Goods Inventory</h1>

    <p>Inventory Management System</p>

</div>


<div class="container">


    <!-- DASHBOARD -->

    <div class="cards">

        <div class="card">

            <h2 id="products">0</h2>

            <p>Products</p>

        </div>


        <div class="card">

            <h2 id="stock">0</h2>

            <p>Total Stock</p>

        </div>


        <div class="card">

            <h2 id="lowstock">0</h2>

            <p>Low Stock</p>

        </div>


        <div class="card">

            <h2 id="outstock">0</h2>

            <p>Out of Stock</p>

        </div>

    </div>


    <!-- BARCODE SCANNER -->

    <div class="scanner">

        <h3>📷 Barcode Scanner</h3>


        <div class="scan-box">

            <video
                id="camera"
                playsinline>
            </video>

            <div
                id="scanLine"
                class="scan-line">
            </div>

        </div>


        <button
            class="scan-button"
            onclick="startScanner()">

            📷 START SCANNER

        </button>


        <button
            id="stopButton"
            class="stop-button"
            onclick="stopScanner()">

            ⛔ STOP CAMERA

        </button>


        <p>
            Or enter barcode manually:
        </p>


        <input
            type="text"
            id="barcode"
            placeholder="Enter barcode number">


        <button
            onclick="searchBarcode()">

            🔍 SEARCH BARCODE

        </button>


        <div id="result"></div>

    </div>

</div>


<script>

let codeReader = null;


/* START BARCODE SCANNER */

async function startScanner() {

    const video =
        document.getElementById("camera");

    const scanLine =
        document.getElementById("scanLine");

    const stopButton =
        document.getElementById("stopButton");

    const result =
        document.getElementById("result");


    result.style.display = "block";

    result.innerHTML =
        "📷 Starting camera...";


    try {

        codeReader =
            new ZXing.BrowserMultiFormatReader();


        video.style.display = "block";

        scanLine.style.display = "block";

        stopButton.style.display = "block";


        const devices =
            await codeReader.listVideoInputDevices();


        if (devices.length === 0) {

            throw new Error(
                "No camera found."
            );

        }


        /* Prefer the back camera */

        let selectedDeviceId =
            devices[devices.length - 1].deviceId;


        for (const device of devices) {

            const label =
                device.label.toLowerCase();

            if (
                label.includes("back") ||
                label.includes("rear") ||
                label.includes("environment")
            ) {

                selectedDeviceId =
                    device.deviceId;

                break;

            }

        }


        codeReader.decodeFromVideoDevice(

            selectedDeviceId,

            video,

            (result, error) => {

                if (result) {

                    const barcode =
                        result.getText();


                    document.getElementById(
                        "barcode"
                    ).value = barcode;


                    document.getElementById(
                        "result"
                    ).style.display = "block";


                    document.getElementById(
                        "result"
                    ).innerHTML =

                    "<span class='success'>" +
                    "✅ Barcode detected!" +
                    "</span><br><br>" +

                    "<strong>Barcode:</strong> " +
                    barcode;


                    stopScanner();


                    searchBarcode();

                }

            }

        );


    } catch (error) {

        console.error(error);


        result.style.display = "block";

        result.innerHTML =

        "<span class='error'>" +

        "❌ Camera could not start." +

        "</span><br><br>" +

        "Please allow camera permission " +
        "and try again.";

    }

}


/* STOP CAMERA */

function stopScanner() {

    if (codeReader) {

        codeReader.reset();

        codeReader = null;

    }


    const video =
        document.getElementById("camera");

    const scanLine =
        document.getElementById("scanLine");

    const stopButton =
        document.getElementById("stopButton");


    video.style.display = "none";

    scanLine.style.display = "none";

    stopButton.style.display = "none";

}


/* MANUAL BARCODE SEARCH */

function searchBarcode() {

    const barcode =
        document.getElementById(
            "barcode"
        ).value.trim();


    const result =
        document.getElementById(
            "result"
        );


    if (barcode === "") {

        result.style.display = "block";

        result.innerHTML =

        "<span class='error'>" +
        "⚠️ Please enter a barcode." +
        "</span>";

        return;

    }


    result.style.display = "block";


    result.innerHTML =

    "<strong>Barcode:</strong> " +
    barcode +

    "<br><br>" +

    "🔎 Searching inventory...";

}

</script>

</body>

</html>
