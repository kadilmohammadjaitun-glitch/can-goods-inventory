<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can Goods Inventory</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f1;
    color:#222
}

.header{
    background:#176b3a;
    color:white;
    padding:20px 15px;
    text-align:center
}

.header h1{
    margin:0;
    font-size:25px
}

.header p{
    margin:6px 0 0;
    font-size:14px
}

.container{
    max-width:800px;
    margin:auto;
    padding:15px
}

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px
}

.card{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.card h2{
    margin:0;
    color:#176b3a;
    font-size:28px
}

.card p{
    margin:5px 0 0;
    color:#666
}

.section{
    background:white;
    margin-top:15px;
    padding:18px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.section h3{
    margin-top:0
}

input,select{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    background:white
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold
}

button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#176b3a;
    color:white;
    font-size:16px;
    font-weight:bold
}

button:active{
    transform:scale(.98)
}

.yellow{
    background:#e6a900
}

.red{
    background:#c62828
}

.blue{
    background:#1976d2
}

.gray{
    background:#666
}

/* CAMERA */

.camera-wrapper{
    position:relative;
    width:100%;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    margin-top:10px;
    display:none
}

#camera{
    width:100%;
    height:auto;
    min-height:250px;
    max-height:420px;
    object-fit:cover;
    display:block;
    background:#000
}

.scan-overlay{
    position:absolute;
    inset:0;
    pointer-events:none
}

.scan-frame{
    position:absolute;
    left:12%;
    right:12%;
    top:25%;
    bottom:25%;
    border:3px solid #00ff66;
    border-radius:12px;
    box-shadow:
        0 0 0 9999px rgba(0,0,0,.25)
}

.scan-line{
    position:absolute;
    left:12%;
    right:12%;
    top:50%;
    height:3px;
    background:red;
    box-shadow:0 0 8px red;
    animation:scanMove 2s linear infinite
}

@keyframes scanMove{
    0%{top:25%}
    50%{top:75%}
    100%{top:25%}
}

.camera-message{
    text-align:center;
    color:white;
    background:rgba(0,0,0,.65);
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:8px;
    font-size:13px
}

#result{
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    background:#eef7ef;
    display:none
}

.success{
    color:#176b3a;
    font-weight:bold
}

.error{
    color:#c62828;
    font-weight:bold
}

.warning{
    color:#9a6900;
    font-weight:bold
}

.product{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin-top:12px
}

.product-image{
    width:100%;
    max-height:180px;
    object-fit:contain;
    border-radius:8px;
    background:#eee;
    margin-bottom:10px
}

.product-name{
    font-size:18px;
    font-weight:bold;
    color:#176b3a
}

.product-info{
    margin-top:5px;
    font-size:14px;
    line-height:1.6
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
    margin-top:5px
}

.status-in{
    background:#d8f3dc;
    color:#176b3a
}

.status-low{
    background:#fff0c2;
    color:#9a6900
}

.status-out{
    background:#ffd9d9;
    color:#c62828
}

.product-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:10px
}

.product-buttons button{
    margin-top:0;
    font-size:13px;
    padding:10px
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000
}

.modal-box{
    background:white;
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:15px;
    padding:20px
}

.modal-box h2{
    margin-top:0;
    color:#176b3a
}

.empty{
    text-align:center;
    color:#777;
    padding:20px
}

.loading{
    text-align:center;
    padding:15px;
    color:#666
}

.camera-status{
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    background:#f5f5f5;
    font-size:14px;
    text-align:center
}

@media(min-width:600px){
    .cards{
        grid-template-columns:repeat(4,1fr)
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🥫 Can Goods Inventory</h1>
    <p>Inventory Management System</p>
</div>

<div class="container">

<!-- DASHBOARD -->
<div class="cards">

    <div class="card">
        <h2 id="productsCount">0</h2>
        <p>Products</p>
    </div>

    <div class="card">
        <h2 id="stockCount">0</h2>
        <p>Total Stock</p>
    </div>

    <div class="card">
        <h2 id="lowStockCount">0</h2>
        <p>Low Stock</p>
    </div>

    <div class="card">
        <h2 id="outStockCount">0</h2>
        <p>Out of Stock</p>
    </div>

</div>


<!-- SCANNER -->
<div class="section">

    <h3>📷 Barcode Scanner</h3>

    <div id="cameraWrapper" class="camera-wrapper">

        <video
            id="camera"
            autoplay
            muted
            playsinline>
        </video>

        <div class="scan-overlay">

            <div class="scan-frame"></div>

            <div class="scan-line"></div>

            <div class="camera-message">
                Place barcode inside the green box
            </div>

        </div>

    </div>

    <div
        id="cameraStatus"
        class="camera-status">
        Camera is stopped.
    </div>

    <button
        class="yellow"
        onclick="startScanner()">
        📷 START SCANNER
    </button>

    <button
        id="stopButton"
        class="red"
        onclick="stopScanner()"
        style="display:none">
        ⛔ STOP CAMERA
    </button>

    <label>Barcode</label>

    <input
        id="barcode"
        type="text"
        inputmode="numeric"
        autocomplete="off"

    <button onclick="searchBarcode()">
        🔍 SEARCH BARCODE
    </button>

    <div id="result"></div>

</div>


<!-- PRODUCT MANAGEMENT -->
<div class="section">

    <h3>📦 Product Management</h3>

    <button onclick="openAddModal()">
        ➕ ADD NEW PRODUCT
    </button>

</div>


<!-- PRODUCT LIST -->
<div class="section">

    <h3>📋 Product List</h3>

    <input
        id="productSearch"
        type="text"
        placeholder="🔎 Search product, brand or barcode"
        oninput="filterProducts()">

    <div id="productList">
        <div class="loading">
            Loading products...
        </div>

</div>

</div>


<!-- PRODUCT MODAL -->
<div id="productModal" class="modal">

<div class="modal-box">

<h2 id="modalTitle">
    ➕ Add Product
</h2>

<input
    type="hidden"
    id="editProductId">

<label>Barcode *</label>

<input
    id="formBarcode"
    type="text"
    inputmode="numeric"
    placeholder="Barcode number">


<label>Product Name *</label>

<input
    id="formProductName"
    type="text"
    placeholder="Example: Mega Sardines">


<label>Brand</label>

<input
    id="formBrand"
    type="text"
    placeholder="Example: Mega">


<label>Category</label>

<input
    id="formCategory"
    type="text"
    placeholder="Example: Sardines">


<label>Unit</label>

<input
    id="formUnit"
    type="text"
    placeholder="Example: can">


<label>Stock</label>

<input
    id="formStock"
    type="number"
    min="0"
    value="0">


<label>Minimum Stock</label>

<input
    id="formMinimumStock"
    type="number"
    min="0"
    value="5">

<input
    id="formPrice"
    type="number"
    min="0"
    step="0.01"
    value="0">

<input
    id="formImage"
    type="text"
    placeholder="https://example.com/image.jpg">

    💾 SAVE PRODUCT
</button>

    ✖ CLOSE

</div>
</div>


<!-- STOCK MODAL -->
<div id="stockModal" class="modal">

<div class="modal-box">

<h2 id="stockModalTitle">
    📦 Stock
</h2>

<input
    type="hidden"
    id="stockProductId">

<label>Quantity</label>

<input
    id="stockQuantity"
    type="number"
    min="1"
    value="1">

<button
    id="stockConfirmButton"
    onclick="confirmStock()">
    CONFIRM
</button>

    class="gray"

    ✖ CANCEL
</button>

</div>
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
'https://xemdlccejsdoglczepsm.supabase.co';

const SUPABASE_KEY =
'sb_publishable_uXDEsaRgAPdwnLrcTjAj4A_j88ihGi4';

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let codeReader = null;
let productsData = [];
let stockAction = "";
let scannerRunning = false;
let scanLocked = false;


/* =====================================================
   LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadProducts
);


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const list =
        document.getElementById("productList");

    list.innerHTML =
        '<div class="loading">Loading products...</div>';

    const {data,error} =
        await supabaseClient
        .from("products")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        console.error(error);

        list.innerHTML =
        '<div class="error">' +
        '❌ Database error<br><br>' +
        escapeHTML(error.message) +
        '</div>';

        return;
    }

    productsData = data || [];

    updateDashboard();
    displayProducts(productsData);
}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

    let total=0;
    let low=0;
    let out=0;

    productsData.forEach(product=>{

        const stock =
            Number(product.stock || 0);

        const minimum =
            Number(product.minimum_stock || 0);

        total += stock;

        if(stock===0){
            out++;
        }
        else if(stock<=minimum){
            low++;
        }

    });

    document.getElementById(
        "productsCount"
    ).textContent =
        productsData.length;

    document.getElementById(
        "stockCount"
    ).textContent =
        total;

    document.getElementById(
        "lowStockCount"
    ).textContent =
        low;

    document.getElementById(
        "outStockCount"
    ).textContent =
        out;
}


/* =====================================================
   PRODUCT STATUS
===================================================== */

function getStatus(product){

    const stock =
        Number(product.stock || 0);

    const minimum =
        Number(product.minimum_stock || 0);

    if(stock===0){

        return {
            text:"🔴 OUT OF STOCK",
            class:"status-out"
        };

    }

    if(stock<=minimum){

        return {
            text:"🟡 LOW STOCK",
            class:"status-low"
        };

    }

    return {
        text:"🟢 IN STOCK",
        class:"status-in"
    };
}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(products){

    const list =
        document.getElementById(
            "productList"
        );

    if(!products.length){

        list.innerHTML =
        '<div class="empty">' +
        '📦 No products found.' +
        '</div>';

        return;
    }

    list.innerHTML="";

    products.forEach(product=>{

        const status =
            getStatus(product);

        let image="";

        if(product.image){

            image =
            '<img class="product-image" ' +
            'src="' +
            escapeHTML(product.image) +
            '" ' +
            'onerror="this.style.display=\'none\'">';
        }

        const div =
            document.createElement("div");

        div.className="product";

        div.innerHTML =

        image +

        '<div class="product-name">' +
        escapeHTML(
            product.product_name || "-"
        ) +
        '</div>' +

        '<div class="product-info">' +

        '<strong>Barcode:</strong> ' +
        escapeHTML(product.barcode || "-") +

        '<br><strong>Brand:</strong> ' +
        escapeHTML(product.brand || "-") +

        '<br><strong>Category:</strong> ' +
        escapeHTML(product.category || "-") +

        '<br><strong>Unit:</strong> ' +
        escapeHTML(product.unit || "-") +

        '<br><strong>Stock:</strong> ' +
        Number(product.stock || 0) +

        '<br><strong>Minimum:</strong> ' +
        Number(product.minimum_stock || 0) +

        '<br><strong>Price:</strong> ₱' +
        Number(product.price || 0).toFixed(2) +

        '<br>' +

        '<span class="status ' +
        status.class +
        '">' +
        status.text +
        '</span>' +

        '</div>' +

        '<div class="product-buttons">' +

        '<button class="blue" ' +
        'onclick="openStockModal(' +
        product.id +
        ',\'in\')">' +
        '📥 STOCK IN' +
        '</button>' +

        '<button class="red" ' +
        'onclick="openStockModal(' +
        product.id +
        ',\'out\')">' +
        '📤 STOCK OUT' +
        '</button>' +

        '<button onclick="editProduct(' +
        product.id +
        ')">' +
        '✏️ EDIT' +
        '</button>' +

        '<button class="gray" ' +
        'onclick="deleteProduct(' +
        product.id +
        ')">' +
        '🗑️ DELETE' +
        '</button>' +

        '</div>';

        list.appendChild(div);

    });
}


/* =====================================================
   FILTER
===================================================== */

function filterProducts(){

    const q =
        document.getElementById(
            "productSearch"
        ).value
        .toLowerCase()
        .trim();

    if(!q){

        displayProducts(productsData);
        return;
    }

    const filtered =
        productsData.filter(product=>{

            return String(
                product.barcode || ""
            ).toLowerCase().includes(q)

            ||

            String(
                product.product_name || ""
            ).toLowerCase().includes(q)

            ||

            String(
                product.brand || ""
            ).toLowerCase().includes(q)

            ||

            String(
                product.category || ""
            ).toLowerCase().includes(q);

        });

    displayProducts(filtered);
}


/* =====================================================
   IMPROVED BARCODE SCANNER
===================================================== */

async function startScanner(){

    if(scannerRunning){
        return;
    }

    const video =
        document.getElementById("camera");

    const wrapper =
        document.getElementById("cameraWrapper");

    const stopButton =
        document.getElementById("stopButton");

    const status =
        document.getElementById("cameraStatus");

    const result =
        document.getElementById("result");

    result.style.display="block";

    result.innerHTML =
        "📷 Requesting camera permission...";

    status.innerHTML =
        "📷 Starting camera...";

    scanLocked=false;

    try{

        if(!window.isSecureContext){

            throw new Error(
                "Camera requires a secure HTTPS connection."
            );
        }

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Your browser does not support camera access."
            );
        }

        /* First request camera permission */
        const permissionStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:{
                        ideal:"environment"
                    }
                },
                audio:false
            });

        /* Stop temporary permission stream */
        permissionStream
            .getTracks()
            .forEach(track=>track.stop());

        codeReader =
            new ZXing.BrowserMultiFormatReader();

        wrapper.style.display="block";
        video.style.display="block";
        stopButton.style.display="block";

        scannerRunning=true;

        status.innerHTML =
            "📷 Camera active — point the barcode inside the green box.";

        result.innerHTML =
            "🔎 Looking for barcode...";

        /*
         * Use rear/environment camera first.
         * This works better on many Android phones.
         */

        const constraints = {

            audio:false,

            video:{
                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }
            }

        };

        await codeReader.decodeFromConstraints(
            constraints,
            video,
            function(result, error){

                if(result && !scanLocked){

                    scanLocked=true;

                    const code =
                        result.getText();

                    console.log(
                        "Barcode detected:",
                        code
                    );

                    document.getElementById(
                        "barcode"
                    ).value=code;

                    status.innerHTML =
                        "✅ Barcode detected: " +
                        escapeHTML(code);

                    resultMessage(
                        "success",
                        "✅ Barcode detected!"
                    );

                    setTimeout(
                        function(){
                            stopScanner();
                            searchBarcode();
                        },
                        300
                    );

                }

            }
        );

    }
    catch(error){

        console.error(
            "Camera error:",
            error
        );

        scannerRunning=false;

        if(codeReader){

            try{
                codeReader.reset();
            }
            catch(e){}

            codeReader=null;
        }

        wrapper.style.display="none";
        stopButton.style.display="none";

        status.innerHTML =
            "❌ Camera stopped.";

        let message =
            "❌ Camera could not start.";

        if(error && error.name){

            if(error.name==="NotAllowedError"){

                message =
                "❌ Camera permission was denied.<br><br>" +
                "Please allow Camera permission in Chrome.";

            }
            else if(
                error.name==="NotFoundError"
            ){

                message =
                "❌ No camera was found on this device.";

            }
            else if(
                error.name==="NotReadableError"
            ){

                message =
                "❌ Camera is being used by another app.";

            }
            else if(
                error.name==="OverconstrainedError"
            ){

                message =
                "❌ Camera settings are not supported. " +
                "Please try again.";

            }
            else{

                message =
                "❌ Camera error:<br><br>" +
                escapeHTML(
                    error.message || String(error)
                );

            }

        }
        else{

            message =
            "❌ Camera error:<br><br>" +
            escapeHTML(
                error.message || String(error)
            );

        }

        result.style.display="block";

        result.innerHTML =
            '<span class="error">' +
            message +
            '</span>';
    }
}


/* =====================================================
   RESULT MESSAGE
===================================================== */

function resultMessage(type,message){

    const result =
        document.getElementById("result");

    result.style.display="block";

    result.innerHTML =
        '<span class="' +
        type +
        '">' +
        message +
        '</span>';
}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner(){

    scannerRunning=false;
    scanLocked=false;

    if(codeReader){

        try{
            codeReader.reset();
        }
        catch(e){

            console.log(
                "Scanner reset:",
                e
            );

        }

        codeReader=null;
    }

    const video =
        document.getElementById("camera");

    /*
     * Stop any active video tracks.
     * This is important on Android so the
     * camera is completely released.
     */

    if(video && video.srcObject){

        try{

            video.srcObject
                .getTracks()
                .forEach(
                    track=>track.stop()
                );

        }
        catch(e){}

        video.srcObject=null;
    }

    document.getElementById(
        "cameraWrapper"
    ).style.display="none";

    document.getElementById(
        "stopButton"
    ).style.display="none";

    document.getElementById(
        "cameraStatus"
    ).innerHTML =
        "Camera is stopped.";
}


/* =====================================================
   BARCODE SEARCH
===================================================== */

async function searchBarcode(){

    const barcode =
        document.getElementById(
            "barcode"
        ).value.trim();

    const result =
        document.getElementById(
            "result"
        );

    if(!barcode){

        result.style.display="block";

        result.innerHTML =
        '<span class="error">' +
        '⚠️ Please enter a barcode.' +
        '</span>';

        return;
    }

    result.style.display="block";

    result.innerHTML =
        "🔎 Searching inventory...";

    const {data,error} =
        await supabaseClient
        .from("products")
        .select("*")
        .eq("barcode",barcode)
        .maybeSingle();

    if(error){

        result.innerHTML =
        '<span class="error">' +
        '❌ Search error<br><br>' +
        escapeHTML(error.message) +
        '</span>';

        return;
    }

    if(!data){

        result.innerHTML =
        '<span class="warning">' +
        '⚠️ Product not found.' +
        '</span><br><br>' +

        '<strong>Barcode:</strong> ' +
        escapeHTML(barcode) +

        '<br><br>' +

        'You can add this product ' +
        'using ADD NEW PRODUCT.';

        return;
    }

    showSearchResult(data);
}


/* =====================================================
   SEARCH RESULT
===================================================== */

function showSearchResult(product){

    const result =
        document.getElementById(
            "result"
        );

    const status =
        getStatus(product);

    let image="";

    if(product.image){

        image =
        '<br><img class="product-image" ' +
        'src="' +
        escapeHTML(product.image) +
        '" ' +
        'onerror="this.style.display=\'none\'">';
    }

    result.innerHTML =

    '<div class="product-name">' +
    escapeHTML(
        product.product_name
    ) +
    '</div>' +

    image +

    '<br>' +

    '<strong>Barcode:</strong> ' +
    escapeHTML(product.barcode || "-") +

    '<br><strong>Brand:</strong> ' +

    status.class +
    '">' +
    status.text +
    '</span>' +

    '<button class="blue" ' +
    'onclick="openStockModal(' +
    product.id +
    ',\'in\')">' +

    '<button class="red" ' +

/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(){

    const id =
        document.getElementById(
            "editProductId"
        ).value;

    const product={

        barcode:
        document.getElementById(
            "formBarcode"
        ).value.trim(),

        product_name:
        document.getElementById(
            "formProductName"
        ).value.trim(),

        brand:
        document.getElementById(
            "formBrand"
        ).value.trim(),

        category:
        document.getElementById(
            "formCategory"
        ).value.trim(),

        unit:
        document.getElementById(
            "formUnit"
        ).value.trim(),

        stock:
        Number(
            document.getElementById(
                "formStock"
            ).value || 0
        ),

        minimum_stock:
        Number(
            document.getElementById(
                "formMinimumStock"
            ).value || 0
        ),

        price:
        Number(
            document.getElementById(
                "formPrice"
            ).value || 0
        ),

        image:
        document.getElementById(
            "formImage"
        ).value.trim()
    };

    if(
        !product.barcode ||
        !product.product_name
    ){

        alert(
            "Please enter Barcode and Product Name."
        );

        return;
    }

    let response;

    if(id){

        response =
            await supabaseClient
            .from("products")
            .update(product)
            .eq("id",id);

    }
    else{

        response =
            await supabaseClient
            .from("products")
            .insert([product]);

    }

    if(response.error){

        alert(
            "❌ Error:\n\n" +
            response.error.message
        );

        return;
    }

    alert(
        id
        ? "✅ Product updated!"
        : "✅ Product added!"
    );

    closeModal();

    loadProducts();
}

function editProduct(id){

    const product =
        productsData.find(
            p => p.id == id
        );

    if(!product)return;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "✏️ Edit Product";

    document.getElementById(

    document.getElementById(

    document.getElementById(

    document.getElementById(

    document.getElementById(
        "formUnit"
    ).value=product.unit || "";

    document.getElementById(

    ).value=product.stock || 0;

    document.getElementById(

/* =====================================================
   DELETE
===================================================== */

async function deleteProduct(id){

    const product =
        productsData.find(
            p => p.id == id
        );

    if(!product)return;

    if(
        !confirm(
            "Delete " +
            product.product_name +
            "?"
        )
    ){

        return;
    }

    const {error} =
        await supabaseClient
        .from("products")
        .delete()
        .eq("id",id);

    if(error){

        alert(
            "❌ Delete failed:\n\n" +
            error.message
        );

        return;
    }

    alert(
        "✅ Product deleted."
    );

    loadProducts();
}
